# secret-template.yaml — DO NOT fill this in and commit it.
#
# Create the real Secret directly with kubectl instead, so nothing sensitive
# ever touches Git history:
#
#   kubectl create secret generic campusswap-secrets \
#     --namespace campusswap \
#     --from-literal=JWT_SECRET=<a-long-random-string> \
#     --from-literal=AZURE_STORAGE_CONNECTION_STRING=<your-azure-connection-string-or-leave-blank>
#
# Every Deployment below pulls both values in via envFrom: secretRef, so as
# long as a Secret named "campusswap-secrets" exists in the campusswap
# namespace with these two keys, nothing else needs to change. Leaving
# AZURE_STORAGE_CONNECTION_STRING blank makes listings-service fall back to
# local-disk image storage (see backend/listings-service/image_storage.py).
apiVersion: v1
kind: Secret
metadata:
  name: campusswap-secrets
  namespace: campusswap
type: Opaque
stringData:
  JWT_SECRET: "REPLACE_ME"
  AZURE_STORAGE_CONNECTION_STRING: ""
